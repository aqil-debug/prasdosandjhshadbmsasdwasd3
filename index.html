<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#45b8ee">
  <meta name="description" content="A sunny walk with Garfield and notes from friends. Tap the cat to read a note.">
  <title>Garfield · A little walk</title>
  <link rel="icon" href="./assets/paw.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>
</head>
<body>
  <main class="world" id="world" aria-label="Garfield's sunny garden">

      <button class="scene-toggle" id="sceneToggle" type="button">

        <img class="scene-background" id="background" src="./assets/background.png" alt="" width="768" height="1376" fetchpriority="high">

            </svg>
            <span class="sprite-frames" id="spriteFrames"></span>
          </span>
        </button>
    <noscript><p class="noscript">Please enable JavaScript to walk and talk with Garfield.</p></noscript>
  </main>

  <dialog class="dialogue" id="dialogue" aria-labelledby="dialogueTitle" aria-describedby="messageText">
    <div class="dialogue-header">
      <div class="dialogue-identity">
        <img src="./assets/paw.svg" alt="" width="38" height="38">
        <div><h2 id="dialogueTitle">Garfield says…</h2></div>
      </div>
      <button class="close-button" id="closeDialogue" type="button" aria-label="Close dialogue" autofocus>×</button>
    </div>
    <div class="message-scroll" id="messageScroll" tabindex="0" aria-label="Message. Swipe left or right to change notes.">
      <span class="quote-mark" aria-hidden="true">“</span>
      <p class="message-text" id="messageText" role="status" aria-live="polite" aria-atomic="true">Just gathering my thoughts…</p>
    </div>
    <div class="dialogue-navigation">
      <button class="nav-button" id="previousMessage" type="button" aria-label="Previous message"><span aria-hidden="true">←</span> Previous</button>
      <span class="message-counter" id="messageCounter" aria-label="Message 1 of 1">1 / 1</span>
      <button class="nav-button next-button" id="nextMessage" type="button" aria-label="Next message">Next <span aria-hidden="true">→</span></button>
    </div>
    <p class="swipe-tip">Swipe for another note <span aria-hidden="true">↔</span></p>
  </dialog>
</body>
</html>
